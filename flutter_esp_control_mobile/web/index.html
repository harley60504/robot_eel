<body>
  <script>
    window.startMJPEGRaw = function(url, callback) {
      fetch(url).then(res => {
        const reader = res.body.getReader();
        function read() {
          reader.read().then(({ value, done }) => {
            if (done) return;
            callback(value);
            read();
          });
        }
        read();
      });
    }
  </script>

</body>
